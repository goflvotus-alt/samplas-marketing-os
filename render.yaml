services:
  - type: web
    name: samplas-marketing-os
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: samplas-cafe24-token-store
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: REPORT_TIMEZONE
        value: Asia/Seoul
      - key: WORK_DIR
        value: /var/data/samplas-dashboard/work
      - key: CAFE24_TOKEN_STORE_DIR
        value: /var/data/samplas-dashboard/secrets
      - key: GRAPH_VERSION
        value: v25.0
      - key: SAMPLAS_INSTAGRAM_USERNAME
        value: samplaskr
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: VEIL_FOUND_IG_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: MCP_ENABLED
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: OAUTH_ISSUER
        sync: false
      - key: MCP_ALLOWED_SUBJECTS
        sync: false
      - key: CAFE24_MALL_ID
        sync: false
      - key: CAFE24_CLIENT_ID
        sync: false
      - key: CAFE24_CLIENT_SECRET
        sync: false
      - key: CAFE24_REDIRECT_URI
        sync: false
      - key: CAFE24_SCOPES
        sync: false
      - key: CAFE24_PROXY_BASIC_AUTH
        sync: false
      - key: NAVER_ADS_API_KEY
        sync: false
      - key: NAVER_ADS_SECRET_KEY
        sync: false
      - key: NAVER_ADS_CUSTOMER_ID
        sync: false
      - key: NAVER_ADS_BASE_URL
        value: https://api.searchad.naver.com
      # SAMPLAS SESSION DIRECTOR (/api/session-director/*). Values are set in the Render dashboard, never here.
      # The web secret must equal SESSION_WEB_SECRET on the Vercel web app; the MCP secret must differ from it.
      - key: SESSION_WEB_SECRET
        sync: false
      - key: SESSION_MCP_SECRET
        sync: false
      # Direct Vercel URL access, no Google OAuth; fixed signed actor web@session.local.
      # Configure SESSION_OPERATOR_EMAILS=web@session.local in the dashboard.
      - key: SESSION_OPERATOR_EMAILS
        sync: false
      # Leave unset by default: answer correction approval is disabled.
      - key: SESSION_APPROVER_EMAILS
        sync: false
      # off (default) | test-only (test-session-* only) | on
      - key: SESSION_MCP_WRITES
        value: "off"
      # ASSETS: read-only view of the design team's Dropbox folder (one "SESSION 00N" folder per session).
      - key: SESSION_ASSETS_ROOT
        sync: false
      # PARTICIPANTS: real applications are synced only when all three are set and the switch is "on".
      # The HMAC key (32+ random characters) finds duplicate phones/e-mails without storing them.
      # The service account is SESSION-only, scope spreadsheets.readonly; share each response sheet with it as viewer.
      - key: SESSION_PARTICIPANTS_SYNC
        value: "off"
      - key: SESSION_PARTICIPANT_HMAC_KEY
        sync: false
      - key: SESSION_GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
